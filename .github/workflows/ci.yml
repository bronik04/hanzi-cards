name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm install, а не npm ci: npm на macOS не кладёт в lock-файл
      # @rollup/rollup-linux-arm64-musl (26 платформ rollup из 27), и строгая
      # проверка полноты в npm ci падает на пакете, который этому раннеру
      # (linux x64) не нужен вовсе. Lock-файл закоммичен и по-прежнему
      # определяет версии.
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm install, а не npm ci — причина выше, в job check.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Отдельной джобой, а не шагом внутри e2e: идёт параллельно, поэтому общее
  # время CI почти не растёт, и даёт свой красный сигнал — сразу видно, сломан
  # именно продакшен-base или приложение вообще. deploy.yml ждёт заключения
  # всего workflow CI, так что новая проверка автоматически становится ещё
  # одним условием публикации и править deploy.yml не нужно.
  e2e-subpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm install, а не npm ci — причина выше, в job check.
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # Подпуть в тестах зашит константой намеренно: сверяться с той же
      # переменной, из которой собрано приложение, бессмысленно. Но после
      # переименования репозитория стенд молча проверял бы подпуть, которого
      # в продакшене нет, — этот шаг превращает рассинхрон в красный CI.
      - name: base.ts matches the production base
        run: |
          expected="/${GITHUB_REPOSITORY##*/}/"
          grep -q "BASE = '${expected}'" e2e-subpath/base.ts \
            || { echo "e2e-subpath/base.ts не совпадает с ${expected}"; exit 1; }
      - run: npm run test:e2e:subpath
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          # Имена артефактов в пределах одного запуска обязаны различаться,
          # а джоба e2e уже занимает playwright-report.
          name: playwright-report-subpath
          path: playwright-report/
          retention-days: 7
