name: Deploy

# Запускается после CI, а не параллельно с ним: иначе коммит, ломающий тесты,
# успевал бы уехать на сайт раньше, чем проверки покраснеют. vite build
# проходит и на сломанной логике, так что без этой связи деплой ничего не ловит.
on:
  workflow_run:
    workflows: [CI]
    branches: [master]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Прерывать публикацию на полпути нельзя: оборванный deploy-pages оставляет
  # окружение github-pages занятым, и следующий деплой приходится разблокировать
  # руками. Так же поступает и стартовый workflow самого GitHub.
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Именно тот коммит, который прошёл CI, а не просто свежий master.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm install, а не npm ci — причина в комментарии к job check в ci.yml.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Pages отдаёт сайт по пути /<имя репозитория>/, поэтому base берётся
          # оттуда же: зашитое руками имя разошлось бы при переименовании молча.
          DEPLOY_BASE: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
