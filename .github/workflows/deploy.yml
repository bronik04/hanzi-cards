name: Deploy

# Только ручной запуск: GitHub Pages в репозитории не включён, и автоматический
# запуск падал бы на каждом push. Чтобы начать публиковать — включите Pages
# (Settings → Pages → Source: GitHub Actions) и запустите workflow вручную,
# либо верните сюда триггер push.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # npm install, а не npm ci: npm на macOS не кладёт в lock-файл
      # @rollup/rollup-linux-arm64-musl (26 платформ rollup из 27), и строгая
      # проверка полноты в npm ci падает на пакете, который этому раннеру
      # (linux x64) не нужен вовсе. Lock-файл закоммичен и по-прежнему
      # определяет версии.
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          # Единственное место, где base отличается от корня.
          DEPLOY_BASE: /hanzi-cards/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
